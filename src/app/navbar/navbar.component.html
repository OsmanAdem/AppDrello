<header class="site-header">
  <nav class="navbar container" aria-label="Main navigation">
    <a class="navbar-brand" routerLink="/home" aria-label="Drello home">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
      <span>Drello</span>
    </a>

    <div class="navbar-menu">
      <a class="navbar-link" routerLink="/home" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a class="navbar-link" routerLink="/boards" routerLinkActive="is-active">
        Boards
        <span
          class="nav-badge"
          *ngIf="auth.isLoggedIn && invitations.count"
          [attr.aria-label]="invitations.count + (invitations.count === 1 ? ' invitation' : ' invitations')"
          [title]="invitations.count + (invitations.count === 1 ? ' invitation waiting' : ' invitations waiting')">{{ invitations.count }}</span>
      </a>
      <a class="navbar-link" routerLink="/about" routerLinkActive="is-active">About</a>
      <ng-container *ngIf="!auth.isLoggedIn">
        <a class="navbar-link" routerLink="/login" routerLinkActive="is-active">Log in</a>
        <a class="navbar-link navbar-signup" routerLink="/signup" routerLinkActive="is-active">Sign up</a>
      </ng-container>
      <button
        type="button"
        class="theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.current === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        [title]="theme.current === 'dark' ? 'Light mode' : 'Dark mode'">
        <app-icon [name]="theme.current === 'dark' ? 'sun' : 'moon'" [size]="18" />
      </button>

      <!-- The logged-in user: avatar + first name, opens a menu with Account settings and Log out -->
      <div class="user-menu" *ngIf="auth.isLoggedIn">
        <button
          type="button"
          class="user-button"
          [class.is-open]="showUserMenu"
          (click)="showUserMenu = !showUserMenu"
          aria-haspopup="menu"
          [attr.aria-expanded]="showUserMenu"
          [attr.aria-label]="'Account menu for ' + (auth.user?.name || 'you')">
          <span class="user-avatar" aria-hidden="true">{{ initials }}</span>
          <span class="user-first-name">{{ firstName }}</span>
          <app-icon name="chevron-down" [size]="14" />
        </button>
        <div class="menu-dismiss" *ngIf="showUserMenu" (click)="showUserMenu = false"></div>
        <div class="user-dropdown" role="menu" *ngIf="showUserMenu">
          <div class="user-dropdown-header">
            <span class="user-avatar is-large" aria-hidden="true">{{ initials }}</span>
            <span class="user-identity">
              <strong>{{ auth.user?.name }}</strong>
              <small>{{ auth.user?.email }}</small>
            </span>
          </div>
          <a role="menuitem" routerLink="/account" (click)="showUserMenu = false">
            <app-icon name="settings" /> Account settings
          </a>
          <a role="menuitem" routerLink="/boards" (click)="showUserMenu = false" *ngIf="invitations.count">
            <app-icon name="checklist" /> Invitations
            <span class="nav-badge">{{ invitations.count }}</span>
          </a>
          <div class="user-dropdown-divider" role="separator"></div>
          <button type="button" role="menuitem" (click)="showUserMenu = false; askToLogout()">
            <app-icon name="log-out" /> Log out
          </button>
        </div>
      </div>
    </div>
  </nav>
</header>

<!-- "Are you sure?" before logging out -->
<div class="logout-backdrop" *ngIf="showLogoutConfirm" (click)="cancelLogout()">
  <section
    class="logout-dialog"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="logout-title"
    aria-describedby="logout-text"
    (click)="$event.stopPropagation()">
    <h2 id="logout-title">Log out?</h2>
    <p id="logout-text">You'll need to log in again to see your boards.</p>
    <div class="logout-actions">
      <button type="button" class="logout-cancel" (click)="cancelLogout()">Cancel</button>
      <button type="button" class="logout-confirm" (click)="logout()" [disabled]="loggingOut" #confirmButton>Log out</button>
    </div>
  </section>
</div>
