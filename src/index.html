<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Drello — A clearer way to work</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1f3f8">
  <meta name="description" content="Organize projects, prioritize tasks, and make steady progress with Drello.">

  <!-- What LinkedIn, Slack, Messenger etc. show when someone shares a link to Drello -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Drello">
  <meta property="og:title" content="Drello — A clearer way to work">
  <meta property="og:description" content="Plan work on boards, a calendar and a timeline, run sprints, and share boards with live updates. Built with Angular, Node.js and PostgreSQL.">
  <meta property="og:url" content="https://drello-jqwv.onrender.com/">
  <meta property="og:image" content="https://drello-jqwv.onrender.com/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Drello: a project board with columns and task cards">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Drello's icon on the browser tab (SVG for sharp screens, .ico for older browsers) and on phones' home screens -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <script>
    try {
      var theme = localStorage.getItem('drello-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
